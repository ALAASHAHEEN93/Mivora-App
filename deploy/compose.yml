# Mivora test version on one server: Caddy (HTTPS + password gate) → app → PostgreSQL.
# Usage on the server (from the repo folder):
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/compose.yml --env-file deploy/.env run --rm migrate
name: mivora
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      GATE_USER: ${GATE_USER}
      GATE_HASH: ${GATE_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

  app:
    build: { context: .., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mivora:${DB_PASSWORD}@db:5432/mivora
      AUTH_SECRET: ${AUTH_SECRET}
      SMTP_URL: ${SMTP_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      - photos:/app/storage
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mivora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mivora
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mivora"]
      interval: 5s
      retries: 10
    # Not published to the internet: only the app can reach it.

  # One-off jobs (full toolchain image): database migrations and demo data.
  migrate:
    build: { context: .., target: build }
    profiles: [tools]
    command: ["pnpm", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://mivora:${DB_PASSWORD}@db:5432/mivora
    depends_on:
      db: { condition: service_healthy }
  seed:
    build: { context: .., target: build }
    profiles: [tools]
    command: ["pnpm", "prisma", "db", "seed"]
    environment:
      DATABASE_URL: postgresql://mivora:${DB_PASSWORD}@db:5432/mivora
    depends_on:
      db: { condition: service_healthy }

  # Daily emails (reminders + "still current?"). Run from the server's cron at 18:00 Berlin:
  #   0 18 * * * cd /opt/mivora && docker compose -f deploy/compose.yml --env-file deploy/.env run --rm jobs
  jobs:
    build: { context: .., target: build }
    profiles: [tools]
    command: ["pnpm", "jobs:daily"]
    environment:
      DATABASE_URL: postgresql://mivora:${DB_PASSWORD}@db:5432/mivora
      SMTP_URL: ${SMTP_URL}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_URL: https://${DOMAIN}
      TZ: Europe/Berlin
    depends_on:
      db: { condition: service_healthy }

volumes:
  db:
  photos:
  caddy-data:
