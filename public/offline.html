<style>

  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; max-width: 34ch; line-height: 1.5; color: var(--muted); }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #f2a68a; color: #263847; font: inherit; font-weight: 700; box-shadow: 0 4px 0 #c9785c; cursor: pointer; }

  svg { width: 200px; height: 136px; }
