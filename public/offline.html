<!doctype html>

<title>Offline · Mivora</title>
<style>
  :root { --bg: #fff7f1; --ink: #263847; --muted: #55606b; --sky: #d3ece8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17232c; --ink: #fff3ea; --muted: #c9c3b4; --sky: #1c3440; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(180deg, var(--sky), var(--bg)); color: var(--ink); }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; max-width: 34ch; line-height: 1.5; color: var(--muted); }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #f2a68a; color: #263847; font: inherit; font-weight: 700; box-shadow: 0 4px 0 #c9785c; cursor: pointer; }
  .en { font-size: 14px; }
  svg { width: 96px; height: 96px; }
  @media (prefers-reduced-motion: no-preference) { svg { animation: bob 2.4s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-6px); } } }
</style>
</head>
<body>
  <svg viewBox="0 0 64 64" aria-hidden="true">

  <h1>Du bist gerade offline</h1>
  <p>Keine Sorge: Deine gemerkten Angebote und Pläne sind auf deinem Gerät gespeichert. Sobald du wieder Internet hast, geht’s weiter.</p>
  <p class="en" lang="en">You’re offline. Your saved activities are safe on this device.</p>
  <button type="button" onclick="location.reload()">Nochmal versuchen</button>
