# Local development database only. Not for production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mivora
      POSTGRES_PASSWORD: mivora_local_only
      POSTGRES_DB: mivora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mivora-db:/var/lib/postgresql/data
  # Catches every email in development; open http://localhost:8025 to read them.
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  mivora-db:
